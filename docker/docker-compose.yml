services:
  postgres:
    image: postgres:15
    container_name: travelkeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelkeet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelkeet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
